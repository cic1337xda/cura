<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Cura. HMS</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" href="/favicon.ico" />
  <style>
    :root {
      --bg: #0F172A;
      --text: #F1F5F9;
      --text-sec: rgba(241, 245, 249, 0.6);
      --blue: #007AFF;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 48px 36px;
      max-width: 460px;
      width: 100%;
      backdrop-filter: blur(24px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
    }
    h1 { font-size: 72px; font-weight: 900; letter-spacing: -2px; color: var(--blue); }
    h2 { font-size: 22px; margin: 12px 0 8px; font-weight: 700; }
    p { font-size: 14px; color: var(--text-sec); margin-bottom: 28px; line-height: 1.5; }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 16px;
      background: var(--blue);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The clinical record or terminal route you are attempting to reach does not exist or has been relocated.</p>
    <a href="/" class="btn">Return to Home</a>
  </div>
</body>
</html>
