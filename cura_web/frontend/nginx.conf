server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    add_header Permissions-Policy "nfc=*" always;

    # No-cache for HTML, icons, and metadata to bust client and proxy caches
    location ~* \.(html|ico|svg|png)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Permissions-Policy "nfc=*" always;
    }

    location /uploads/ {
        proxy_pass http://cura_backend:8000/uploads/;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://cura_backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}